# Documentation site (MkDocs + Material for MkDocs), published to GitHub Pages.
# Preview locally without adding project dependencies:
#   uvx --with mkdocs-material mkdocs serve
# site_url assumes the planned repository rename to "axpilot" (docs/adr/0007-name-axpilot.md).
site_name: AXPilot
site_description: The MCP server for macOS. Lets AI agents see and operate a Mac, safely.
site_author: AXPilot contributors
site_url: https://vansh3503.github.io/axpilot/
repo_name: vansh3503/Mac-Mcp
repo_url: https://github.com/vansh3503/Mac-Mcp
edit_uri: edit/main/docs/
copyright: Copyright © AXPilot contributors · Apache-2.0

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Install: install.md
      - Permissions: permissions.md
      - Connect a client: clients.md
      - Agent frameworks: frameworks.md
  - Reference:
      - Tools: tools.md
      - Configuration: configuration.md
  - Security model: security.md
  - Troubleshooting: troubleshooting.md
  - Project:
      - Architecture decisions:
          - adr/README.md
          - "ADR-1: Python + PyObjC": adr/0001-language-python-pyobjc.md
          - "ADR-2: Launcher, host and bridge": adr/0002-architecture-launcher-host-bridge.md
          - "ADR-3: Minimum macOS 14": adr/0003-minimum-macos-14.md
          - "ADR-4: MCP protocol surface": adr/0004-mcp-protocol-surface.md
          - "ADR-5: Signing and distribution": adr/0005-signing-and-distribution.md
          - "ADR-6: Privacy, no telemetry": adr/0006-privacy-no-telemetry.md
          - "ADR-7: Name": adr/0007-name-axpilot.md
      - Project plan: PLAN.md

# Internal engineering notes stay in the repository but out of the navigation.
not_in_nav: |
  /dev/
  /spikes/

validation:
  links:
    absolute_links: info
    unrecognized_links: warn
