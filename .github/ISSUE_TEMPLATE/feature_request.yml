name: Feature or tool request
description: Suggest a new tool, a change to an existing tool, or another improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Tool names, parameters and output schemas are public API, so we like to
        agree on the shape in an issue before anyone writes code. Please check the
        [tool reference](https://github.com/vansh3503/Mac-Mcp/blob/main/docs/tools.md) and the
        [roadmap](https://github.com/vansh3503/Mac-Mcp/blob/main/docs/PLAN.md) first: it may already be planned.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      options:
        - New tool
        - Change to an existing tool (parameters, output, behaviour)
        - Safety / policy control
        - Client or framework integration
        - Installation, setup or CLI
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: toolset
    attributes:
      label: Toolset (if it is about a tool)
      options:
        - observe
        - input
        - apps
        - system
        - scripting
        - browser
        - computer
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you or your agent trying to do, and what gets in the way today?
      placeholder: "My agent needs to ... but currently it has to ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe the behaviour you'd like. For a tool, sketch its name, parameters, what it returns,
        its annotations (read-only? destructive?) and the error codes it could return.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds or designs you considered (for example a combination of existing tools).
    validations:
      required: false

  - type: textarea
    id: safety
    attributes:
      label: Safety and privacy considerations
      description: Could this be misused through prompt injection? Does it read sensitive data or need a new macOS permission?
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to help implement or test this.
          required: false
