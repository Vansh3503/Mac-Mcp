name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        # --locked fails instead of re-locking when pyproject.toml and uv.lock disagree.
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format --check
        # Ruff also formats Python code blocks in Markdown. PLAN.md and CONTRACTS.md hold
        # deliberately aligned pseudo-code signatures, so they are skipped here (move this
        # exclusion to [tool.ruff] extend-exclude in pyproject.toml when convenient).
        run: uv run ruff format --check --diff --extend-exclude "docs/PLAN.md,docs/dev/CONTRACTS.md" .

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: pyright
        run: uv run pyright

  test-linux:
    name: Test (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: pytest
        run: >-
          uv run pytest
          --cov --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
      - name: Upload coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-linux-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  test-macos:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    env:
      # Tests that drive the real desktop need Accessibility, which hosted runners don't grant
      # (spike S5). They stay skipped unless AXPILOT_MACOS_TESTS=1; this job proves that the
      # package installs with PyObjC and that everything else passes on macOS.
      AXPILOT_MACOS_TESTS: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies (includes PyObjC on macOS)
        run: uv sync --locked
      - name: Show macOS version
        run: sw_vers && uname -m
      - name: pytest
        run: uv run pytest

  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build
      - name: Check metadata renders (twine)
        run: uvx twine check --strict dist/*
      - name: Check wheel and sdist contents
        run: |
          uv run --no-project python - <<'PY'
          import email.parser
          import pathlib
          import tarfile
          import zipfile

          dist = pathlib.Path("dist")
          wheels = sorted(dist.glob("axpilot-*.whl"))
          sdists = sorted(dist.glob("axpilot-*.tar.gz"))
          assert len(wheels) == 1, f"expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"expected one sdist, found {sdists}"

          with zipfile.ZipFile(wheels[0]) as whl:
              names = set(whl.namelist())
              metadata_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
              meta = email.parser.Parser().parsestr(whl.read(metadata_name).decode())
          assert meta["Name"] == "axpilot", meta["Name"]
          assert meta["Requires-Python"] == ">=3.11", meta["Requires-Python"]
          assert meta["License-Expression"] == "Apache-2.0", meta["License-Expression"]
          assert "mcp-name: io.github.vansh3503/axpilot" in meta.get_payload(), "README lost the MCP Registry marker"
          for required in ("axpilot/__init__.py", "axpilot/engine/fixtures/demo_desktop.json"):
              assert required in names, f"wheel is missing {required}"
          assert not any(n.startswith("tests/") for n in names), "tests must not ship in the wheel"

          with tarfile.open(sdists[0]) as sdist:
              members = {m.name.split("/", 1)[1] for m in sdist.getmembers() if "/" in m.name}
          for required in ("pyproject.toml", "README.md", "LICENSE", "CHANGELOG.md", "src/axpilot/__init__.py"):
              assert required in members, f"sdist is missing {required}"

          print(f"OK: {wheels[0].name} ({meta['Version']}), {sdists[0].name}")
          PY
      - name: Smoke-test the wheel in a clean environment
        run: |
          wheel="$(ls dist/axpilot-*.whl)"
          uv run --isolated --no-project --with "$wheel" python -c "import axpilot; print('axpilot', axpilot.__version__)"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build the documentation site
        env:
          NO_MKDOCS_2_WARNING: "1"
        # The docs toolchain is not a project dependency; it runs in an ephemeral tool environment.
        run: uvx --with "mkdocs-material>=9.7,<10" mkdocs build --strict --site-dir "$RUNNER_TEMP/site"

  ci-success:
    name: CI success
    if: always()
    needs: [lint, typecheck, test-linux, test-macos, build, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::At least one required job did not succeed ($result)."
              exit 1
            fi
          done
