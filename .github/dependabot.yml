version: 2
updates:
  # Python dependencies: pyproject.toml + uv.lock (Dependabot's native uv support).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies", "python"]
    groups:
      # Dev tooling moves fast and is low-risk; batch it into one PR.
      dev-tools:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # PyObjC framework packages are released together; update them together.
      pyobjc:
        patterns: ["pyobjc*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
