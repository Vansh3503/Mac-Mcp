id = "login-remember"
title = "Tick \"Remember me\""
goal = "In Login Demo's sign-in sheet, tick \"Remember me\"."
tags = ["forms", "controls"]
max_steps = 10

[[check]]
tool = "find"
args = { app = "Login Demo", text = "Remember me", role = "checkbox" }
path = "matches.0.value"
op = "equals"
value = "1"

[[solution]]
tool = "find"
args = { app = "Login Demo", text = "Remember me", role = "checkbox" }
save = { box = "matches.0.ref" }

[[solution]]
tool = "set_value"
args = { ref = "$box", value = "on" }
