id = "slack-message"
title = "Draft a Slack message"
goal = "Open Slack and type \"Standup in 5 minutes\" into the #general message box. Do not send it."
tags = ["electron", "input", "apps"]
max_steps = 12

[[check]]
tool = "find"
args = { app = "Slack", text = "Message #general", role = "textarea" }
path = "matches.0.value"
op = "equals"
value = "Standup in 5 minutes"

[[solution]]
tool = "app"
args = { action = "launch", name = "Slack" }

[[solution]]
tool = "find"
args = { app = "Slack", text = "Message #general", role = "textarea" }
save = { box = "matches.0.ref" }

[[solution]]
tool = "type_text"
args = { ref = "$box", text = "Standup in 5 minutes" }
