id = "finder-new-folder"
title = "New folder from a menu button"
goal = "In Finder, create a new folder in Downloads with the Action menu button in the toolbar."
tags = ["finder", "menus", "controls"]
max_steps = 10

[[check]]
tool = "find"
args = { app = "Finder", text = "untitled folder", role = "row" }
path = "matches.0.name"
op = "contains"
value = "untitled folder"

[[solution]]
tool = "find"
args = { app = "Finder", text = "Action", role = "menubutton" }
save = { action = "matches.0.ref" }

[[solution]]
tool = "select_option"
args = { ref = "$action", option = "New Folder" }
