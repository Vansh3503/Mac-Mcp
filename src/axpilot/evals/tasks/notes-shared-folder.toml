id = "notes-shared-folder"
title = "Switch to the Shared folder"
goal = "In Notes, switch to the Shared folder in the sidebar."
tags = ["notes", "lists"]
max_steps = 10

[[check]]
tool = "find"
args = { app = "Notes", text = "Shared", role = "row" }
path = "matches.0.states"
op = "contains"
value = "selected"

[[solution]]
tool = "find"
args = { app = "Notes", text = "Shared", role = "row" }
save = { folder = "matches.0.ref" }

[[solution]]
tool = "click"
args = { ref = "$folder" }
