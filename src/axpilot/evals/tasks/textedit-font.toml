id = "textedit-font"
title = "Change the font"
goal = "In TextEdit, change the font family in the format bar to Menlo."
tags = ["textedit", "controls"]
max_steps = 10

[[check]]
tool = "find"
args = { app = "TextEdit", text = "Font Family", role = "popup" }
path = "matches.0.value"
op = "equals"
value = "Menlo"

[[solution]]
tool = "find"
args = { app = "TextEdit", text = "Font Family", role = "popup" }
save = { font = "matches.0.ref" }

[[solution]]
tool = "set_value"
args = { ref = "$font", value = "Menlo" }
