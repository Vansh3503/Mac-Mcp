id = "finder-search"
title = "Search in Finder"
goal = "Use the search field of the Finder window to search for invoice."
tags = ["finder", "input"]
max_steps = 10

[[check]]
tool = "find"
args = { app = "Finder", text = "search", role = "search" }
path = "matches.0.value"
op = "equals"
value = "invoice"

[[solution]]
tool = "find"
args = { app = "Finder", text = "search", role = "search" }
save = { search = "matches.0.ref" }

[[solution]]
tool = "type_text"
args = { ref = "$search", text = "invoice" }
