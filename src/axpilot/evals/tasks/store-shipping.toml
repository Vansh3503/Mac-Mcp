id = "store-shipping"
title = "Use a custom web dropdown"
goal = "Open Google Chrome and choose express shipping on the checkout page."
tags = ["web", "controls", "apps"]
max_steps = 12

[[check]]
tool = "find"
args = { app = "Google Chrome", text = "Express (2 days)", role = "text" }
path = "matches.0.name"
op = "equals"
value = "Express (2 days)"

[[solution]]
tool = "app"
args = { action = "launch", name = "Google Chrome" }

[[solution]]
tool = "find"
args = { app = "Google Chrome", text = "Shipping method", role = "combobox" }
save = { shipping = "matches.0.ref" }

[[solution]]
tool = "select_option"
args = { ref = "$shipping", option = "express" }
