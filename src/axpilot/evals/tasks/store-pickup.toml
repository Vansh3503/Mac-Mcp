id = "store-pickup"
title = "Search a web autocomplete"
goal = "Open Google Chrome and choose the Oslo pickup store on the checkout page."
tags = ["web", "controls", "apps"]
max_steps = 12

[[check]]
tool = "find"
args = { app = "Google Chrome", text = "Pickup store", role = "combobox" }
path = "matches.0.value"
op = "contains"
value = "Oslo"

[[solution]]
tool = "app"
args = { action = "launch", name = "Google Chrome" }

[[solution]]
tool = "find"
args = { app = "Google Chrome", text = "Pickup store", role = "combobox" }
save = { pickup = "matches.0.ref" }

[[solution]]
tool = "select_option"
args = { ref = "$pickup", option = "Oslo" }
