id = "textedit-heading-style"
title = "Choose a paragraph style"
goal = "In TextEdit, set the paragraph style in the format bar to Heading."
tags = ["textedit", "controls"]
max_steps = 10

[[check]]
tool = "find"
args = { app = "TextEdit", text = "Paragraph Styles", role = "popup" }
path = "matches.0.value"
op = "equals"
value = "Heading"

[[solution]]
tool = "find"
args = { app = "TextEdit", text = "Paragraph Styles", role = "popup" }
save = { styles = "matches.0.ref" }

[[solution]]
tool = "select_option"
args = { ref = "$styles", option = "Heading" }
