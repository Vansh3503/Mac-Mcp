# Install once with `uvx pre-commit install`; run on everything with `uvx pre-commit run --all-files`.
# Keep the ruff rev in step with the version locked in uv.lock (`uv run ruff --version`), so that
# pre-commit and CI agree. Update hook revisions with `uvx pre-commit autoupdate`.
minimum_pre_commit_version: "3.2.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        # Design docs with deliberately aligned pseudo-code (same exclusion as CI).
        exclude: ^docs/(PLAN|dev/CONTRACTS)\.md$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
