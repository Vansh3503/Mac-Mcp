[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "axpilot"
dynamic = ["version"]
description = "AXPilot: an MCP server that lets AI agents see and operate macOS, safely."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "AXPilot contributors" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "macos",
  "accessibility",
  "computer-use",
  "automation",
  "ai-agents",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.12",
  "anyio>=4.11",
  "typer>=0.16",
  "tomli-w>=1.0",
  "pillow>=10.4",
  # Native macOS bridges. Only installed on macOS; the rest of the package
  # (server, policy, perception, tests) runs anywhere.
  "pyobjc-core>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=11.0; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=11.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/vansh3503/Mac-Mcp"
Documentation = "https://github.com/vansh3503/Mac-Mcp/tree/main/docs"
Issues = "https://github.com/vansh3503/Mac-Mcp/issues"
Changelog = "https://github.com/vansh3503/Mac-Mcp/blob/main/CHANGELOG.md"

[project.scripts]
axpilot = "axpilot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[tool.hatch.version]
path = "src/axpilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/axpilot"]

[tool.hatch.build.targets.sdist]
include = ["src/axpilot", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# Design documents contain aligned pseudo-code, not formatted Python.
extend-exclude = ["docs/PLAN.md", "docs/dev/CONTRACTS.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "PL"]
ignore = [
  "PLR0911", # too many return statements
  "PLR0912", # too many branches
  "PLR0913", # too many arguments (tool signatures are wide by design)
  "PLR0915", # too many statements
  "PLR2004", # magic values
  "S101",    # assert (used in tests)
  "S603",    # subprocess without shell=True is the safe form we use deliberately
  "S607",    # partial executable paths (osascript, mdfind, ...) are system tools
  "RUF001",  # ambiguous unicode (we print ⌘/⌥ glyphs on purpose)
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415", "PT011"]
"spikes/**" = ["S", "T201", "PLC0415"]
"src/axpilot/engine/macos/**" = ["PLC0415"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/axpilot/engine/macos", "src/axpilot/host/ui", "spikes"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests", "spikes/tests", "launcher/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "macos: needs a real macOS session with Accessibility permission (skipped elsewhere)",
  "e2e: end-to-end test that drives real apps",
]
filterwarnings = ["error::DeprecationWarning:axpilot.*"]

[tool.coverage.run]
source = ["axpilot"]
branch = true
omit = ["src/axpilot/engine/macos/*", "src/axpilot/host/ui/*"]
